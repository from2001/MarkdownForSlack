name: Test and deploy to Lolipop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and prepare site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s test -p '*_test.py' -v
      - run: npm run build:deploy
      - name: Check vendored parser
        run: |
          cmp vendor/marked.esm.js node_modules/marked/lib/marked.esm.js
          cmp vendor/marked.LICENSE node_modules/marked/LICENSE

  deploy:
    name: Deploy production site
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: lolipop-markdown-for-slack-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://yamaguchimasahiro.com/web/MarkdownForSlack/
    env:
      FTP_HOST: ${{ vars.FTP_HOST }}
      FTP_USERNAME: ${{ vars.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment settings
        run: python3 scripts/deploy-ftps.py --check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Skip an outdated run
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main revision exists; this run will not overwrite it.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare public assets
        if: steps.revision.outputs.current == 'true'
        run: npm run build:deploy
      - name: Upload over explicit FTPS
        if: steps.revision.outputs.current == 'true'
        run: python3 scripts/deploy-ftps.py
      - name: Verify public content
        if: steps.revision.outputs.current == 'true'
        run: npm run verify:deploy
      - name: Record deployment
        if: steps.revision.outputs.current == 'true'
        run: |
          echo "Deployed and verified commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'Site: https://yamaguchimasahiro.com/web/MarkdownForSlack/' >> "$GITHUB_STEP_SUMMARY"
