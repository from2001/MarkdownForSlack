name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and prepare site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:deploy
      - name: Check vendored parser
        run: |
          cmp vendor/marked.esm.js node_modules/marked/lib/marked.esm.js
          cmp vendor/marked.LICENSE node_modules/marked/LICENSE
      - name: Upload public assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .deploy/

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages-markdown-for-slack
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip an outdated run
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main revision exists; this run will not overwrite it.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish to GitHub Pages
        id: deployment
        if: steps.revision.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: '22'
      - name: Prepare expected assets
        if: steps.revision.outputs.current == 'true'
        run: npm run build:deploy
      - name: Verify public content
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run verify:deploy
      - name: Record deployment
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Deployed and verified commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo "Site: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
