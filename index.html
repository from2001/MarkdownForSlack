<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MarkdownをSlackで使える書式へ変換して、プレビュー・コピーできます。">
  <title>Markdown for Slack</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header>
    <h1>Markdown <span>for Slack</span></h1>
    <div class="actions">
      <button id="copyRich" disabled>書式付きでコピー</button>
      <button id="copyPlain" class="secondary" disabled>テキストでコピー</button>
      <button id="clear" class="secondary">クリア</button>
    </div>
  </header>
  <main class="container">
    <section class="pane" aria-labelledby="editorLabel">
      <div class="pane-header"><label id="editorLabel" for="editor">Markdown</label><span>入力はブラウザ内で変換</span></div>
      <textarea id="editor" placeholder="ここにMarkdownを貼り付けてください。&#10;&#10;# 見出し → 本文サイズの太字&#10;表 → 項目名：値&#10;- [ ] タスク → ☐ タスク" spellcheck="false"></textarea>
    </section>
    <section class="pane preview-pane" aria-labelledby="previewLabel">
      <div class="pane-header">
        <span id="previewLabel">プレビュー（Slack貼り付け用）</span>
        <label class="table-option" for="tableMode">表の表示
          <select id="tableMode">
            <option value="fields">項目ごと</option>
            <option value="code">等幅（コード）</option>
          </select>
        </label>
      </div>
      <div id="conversionSummary" class="conversion-summary" role="status">読み込み中…</div>
      <div class="preview-scroll">
        <div id="emptyPreview" class="empty-preview" hidden>左にMarkdownを貼り付けると、<br>Slack向けに変換した内容がここに表示されます。</div>
        <div id="preview" tabindex="0" aria-label="変換後のプレビュー"></div>
      </div>
      <p class="paste-help">Slackの通常の入力欄に貼り付けてください。マークアップ入力モードでは書式が保持されません。</p>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <noscript>このアプリを利用するにはJavaScriptを有効にしてください。</noscript>
</body>
</html>
